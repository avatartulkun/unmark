<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NotebookLM 去水印</title>
<style>
  :root{
    --bg:#F5F7FB; --card:#FFFFFF; --ink:#1D2939; --muted:#667085;
    --line:#E4E7EC; --accent:#6C63FF; --accent-dark:#574FE6;
    --ok:#067647; --ok-bg:#ECFDF3; --warn:#B54708; --warn-bg:#FFFAEB;
    --err:#B42318; --err-bg:#FEF3F2;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:40px 24px 64px}
  h1{font-size:26px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 28px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:24px;margin-bottom:18px}

  /* 拖放区 */
  #drop{border:2px dashed #CDD3DF;border-radius:14px;padding:44px 24px;text-align:center;
        cursor:pointer;transition:.15s;background:#FCFCFE}
  #drop:hover,#drop.hot{border-color:var(--accent);background:#F5F4FF}
  #drop h2{margin:0 0 6px;font-size:17px}
  #drop p{margin:0;color:var(--muted);font-size:13px}

  button{font:inherit;border-radius:9px;border:1px solid var(--line);background:#fff;
         color:var(--ink);padding:10px 18px;cursor:pointer;transition:.15s}
  button:hover:not(:disabled){border-color:#B9BFCC}
  button:disabled{opacity:.45;cursor:not-allowed}
  .primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .primary:hover:not(:disabled){background:var(--accent-dark);border-color:var(--accent-dark)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

  /* 进度 */
  .bar{height:8px;background:#EEF0F4;border-radius:99px;overflow:hidden;margin:14px 0 8px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;
         transition:width .25s}
  .bar.indet>i{width:35%;animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}
  .stage{color:var(--muted);font-size:13px}

  /* 结果横幅 */
  .banner{border-radius:11px;padding:14px 16px;margin-bottom:18px;font-size:14px}
  .banner.ok{background:var(--ok-bg);color:var(--ok);border:1px solid #A9EFC5}
  .banner.warn{background:var(--warn-bg);color:var(--warn);border:1px solid #FEDF89}
  .banner.err{background:var(--err-bg);color:var(--err);border:1px solid #FECDCA}

  /* 对比 */
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px}
  .pane h3{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600;
           display:flex;justify-content:space-between;align-items:center}
  .pane img{width:100%;display:block;border:1px solid var(--line);border-radius:9px;
            background:#fff;image-rendering:crisp-edges}
  .tag{font-weight:700;letter-spacing:.02em}
  .tag.before{color:var(--err)} .tag.after{color:var(--ok)}
  .zoomnote{font-size:12px;color:var(--muted);margin:14px 0 6px}

  .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;
        margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
  .meta div{font-size:13px}
  .meta b{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-bottom:2px}
  .nav{display:flex;gap:8px;align-items:center;margin-top:16px}
  .nav input{width:64px;padding:7px;border:1px solid var(--line);border-radius:8px;
             text-align:center;font:inherit}
  .hide{display:none}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:26px}
</style>
</head>
<body>
<div class="wrap">
  <h1>NotebookLM 去水印</h1>
  <p class="sub">跨页求交集自动定位固定角标（NotebookLM 等）并修复整本。<!--SUB_NOTE--></p>

  <!-- 1. 选文件 -->
  <div class="card" id="step-pick">
    <div id="drop">
      <h2>把 PDF 拖到这里，或点击选择</h2>
      <p>整页是一张图的 PDF 效果最好；有文字层的页会自动跳过</p>
    </div>
    <input type="file" id="file" accept="application/pdf,.pdf" class="hide">
  </div>

  <!-- 2. 处理中 -->
  <div class="card hide" id="step-run">
    <div class="row" style="justify-content:space-between">
      <strong id="run-name"></strong>
      <button id="cancel">取消</button>
    </div>
    <div class="bar indet" id="bar"><i></i></div>
    <div class="stage" id="stage">正在读取 PDF…</div>
  </div>

  <!-- 3. 结果 -->
  <div class="card hide" id="step-done">
    <div class="banner" id="banner"></div>

    <div id="compare">
      <p class="zoomnote">放大到检测出的水印位置——左边是原图，右边是处理后：</p>
      <div class="pair">
        <div class="pane">
          <h3><span class="tag before">处理前</span></h3>
          <img id="zoom-before" alt="处理前的水印区域">
        </div>
        <div class="pane">
          <h3><span class="tag after">处理后</span></h3>
          <img id="zoom-after" alt="处理后的水印区域">
        </div>
      </div>

      <p class="zoomnote">整页对比：</p>
      <div class="pair">
        <div class="pane">
          <h3><span class="tag before">处理前</span></h3>
          <img id="full-before" alt="处理前整页">
        </div>
        <div class="pane">
          <h3><span class="tag after">处理后</span></h3>
          <img id="full-after" alt="处理后整页">
        </div>
      </div>

      <div class="nav">
        <button id="prev">← 上一页</button>
        <input id="pageno" type="number" min="1" value="1">
        <span class="stage" id="pagetotal"></span>
        <button id="next">下一页 →</button>
      </div>
    </div>

    <div class="meta" id="meta"></div>

    <div class="row" style="margin-top:20px">
      <button class="primary" id="download">下载去水印后的 PDF</button>
      <button id="again">换一个文件</button>
    </div>
  </div>

  <p class="foot">只修改判定出的水印像素，其余像素逐位不变，写出后抽页复核。原始 PDF 不会被改写。<!--FOOT_NOTE--></p>
</div>

<script>
const $ = id => document.getElementById(id);
let job = null, pageCount = 1, page = 1, poll = null;

function show(step){
  for (const id of ["step-pick","step-run","step-done"])
    $(id).classList.toggle("hide", id !== step);
}

/* ---------- 选文件 ---------- */
$("drop").onclick = () => $("file").click();
$("file").onchange = e => { if (e.target.files[0]) upload(e.target.files[0]); };
["dragenter","dragover"].forEach(t => $("drop").addEventListener(t, e => {
  e.preventDefault(); $("drop").classList.add("hot");
}));
["dragleave","drop"].forEach(t => $("drop").addEventListener(t, e => {
  e.preventDefault(); $("drop").classList.remove("hot");
}));
$("drop").addEventListener("drop", e => {
  const f = e.dataTransfer.files[0];
  if (f) upload(f);
});

async function upload(file){
  if (!file.name.toLowerCase().endsWith(".pdf")) { alert("请选择 PDF 文件。"); return; }
  $("run-name").textContent = file.name;
  $("stage").textContent = "正在读取 PDF…";
  $("bar").classList.add("indet");
  show("step-run");
  try{
    const res = await fetch("/api/jobs", {
      method:"POST",
      headers:{"content-type":"application/octet-stream",
               "x-filename":encodeURIComponent(file.name)},
      body:file
    });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    job = (await res.json()).id;
    history.replaceState(null, "", "?job=" + job);   // 刷新页面不丢结果
    poll = setInterval(tick, 400);
  }catch(err){ fail(err.message); }
}

/* 带 ?job=xxx 打开时，直接恢复那次任务的状态 */
(async function resume(){
  const id = new URLSearchParams(location.search).get("job");
  if (!id) return;
  const res = await fetch(`/api/jobs/${id}`);
  if (!res.ok) { history.replaceState(null, "", location.pathname); return; }
  job = id;
  const s = await res.json();
  $("run-name").textContent = s.name;
  if (s.status === "running"){ show("step-run"); poll = setInterval(tick, 400); }
  else if (s.status === "done") succeed(s);
  else fail(s.error || s.stage, s.status);
})();

/* ---------- 轮询进度 ---------- */
async function tick(){
  const res = await fetch(`/api/jobs/${job}`);
  if (!res.ok) { clearInterval(poll); return fail("任务已丢失"); }
  const s = await res.json();
  $("stage").textContent = s.stage + (s.total ? `（${s.current}/${s.total}）` : "");
  if (s.total){
    $("bar").classList.remove("indet");
    $("bar").firstElementChild.style.width = (100 * s.current / s.total) + "%";
  }
  if (s.status === "running") return;
  clearInterval(poll);
  s.status === "done" ? succeed(s) : fail(s.error || s.stage, s.status);
}

/* ---------- 结果 ---------- */
function succeed(s){
  const r = s.result || {};
  $("banner").className = "banner ok";
  $("banner").textContent = "✅ " + r.message;
  $("compare").classList.remove("hide");
  $("download").classList.remove("hide");
  pageCount = Math.max(1, r.pages_processed || 1);
  page = 1;
  $("pagetotal").textContent = `/ 共 ${pageCount} 页已处理`;
  $("pageno").max = pageCount;
  const box = (r.box || []).join(", ");
  $("meta").innerHTML = [
    ["检测方式", r.strategy || "—"],
    ["水印位置", box ? `x${r.box[0]}–${r.box[2]}, y${r.box[1]}–${r.box[3]}` : "—"],
    ["涂改面积", (r.area_percent ?? 0).toFixed(3) + "% / 页"],
    ["处理页数", `${r.pages_processed} 页` + (r.skipped?.length ? `（跳过 ${r.skipped.length} 页）` : "")],
  ].map(([k,v]) => `<div><b>${k}</b>${v}</div>`).join("");
  render();
  show("step-done");
}

function fail(msg, status){
  const warn = status === "failed" || status === "cancelled";
  $("banner").className = "banner " + (warn ? "warn" : "err");
  $("banner").textContent = (status === "cancelled" ? "已取消：" : "⚠️ 没有处理：") + msg;
  $("compare").classList.add("hide");
  $("download").classList.add("hide");
  $("meta").innerHTML = "";
  show("step-done");
}

function render(){
  const b = `/api/jobs/${job}/preview?page=${page}`;
  $("zoom-before").src = `${b}&side=before&zoom=1`;
  $("zoom-after").src  = `${b}&side=after&zoom=1`;
  $("full-before").src = `${b}&side=before`;
  $("full-after").src  = `${b}&side=after`;
  $("pageno").value = page;
  $("prev").disabled = page <= 1;
  $("next").disabled = page >= pageCount;
}

$("prev").onclick = () => { if (page > 1){ page--; render(); } };
$("next").onclick = () => { if (page < pageCount){ page++; render(); } };
$("pageno").onchange = e => {
  const v = Math.min(pageCount, Math.max(1, parseInt(e.target.value) || 1));
  page = v; render();
};
$("cancel").onclick = () => fetch(`/api/jobs/${job}/cancel`, {method:"POST"});
$("download").onclick = () => location.href = `/api/jobs/${job}/download`;
$("again").onclick = () => {
  if (job) fetch(`/api/jobs/${job}`, {method:"DELETE"});
  job = null; $("file").value = "";
  history.replaceState(null, "", location.pathname);
  show("step-pick");
};
</script>
</body>
</html>
