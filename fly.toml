# Fly.io 部署配置。首次部署：fly launch --no-deploy 之后 fly deploy
app = "unmark"
primary_region = "nrt"          # 东京；改成离你的用户最近的区域

[build]
  dockerfile = "Dockerfile"

[env]
  UNMARK_HOST = "0.0.0.0"
  UNMARK_MAX_UPLOAD_MB = "50"
  UNMARK_MAX_CONCURRENT = "1"   # 公开服务保守运行：一次只处理一个任务
  UNMARK_MAX_LIVE_JOBS = "12"
  UNMARK_RATE_LIMIT = "12"      # 每个 IP 每小时最多发起几次
  UNMARK_RATE_WINDOW_MIN = "60"
  UNMARK_JOB_TTL_MIN = "120"    # 任务文件保留时长，到点连临时文件一起删
  UNMARK_TRUST_PROXY = "1"      # 在 Fly 的负载均衡后面，按转发头认来源 IP

[http_service]
  internal_port = 8823
  force_https = true
  auto_stop_machines = "suspend"  # 没人用时挂起，省钱
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 8
    hard_limit = 16

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"                # 整页位图运算吃内存；低于 1gb 处理大 PDF 会被 OOM 杀掉
