# 家用部署：一台常开的电脑 + Cloudflare Tunnel。
#
#   docker compose up -d
#
# 隧道是出站连接，所以不需要公网 IP、不需要在路由器上开端口，
# 在运营商大内网（CGNAT）后面也照常工作。
#
# 用法见 README「部署成公开服务」。TUNNEL_TOKEN 从 Cloudflare Zero Trust
# 后台创建隧道时拿到，写进同目录的 .env 文件，不要提交进仓库。

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      UNMARK_HOST: "0.0.0.0"
      UNMARK_PUBLIC_MODE: "1"         # 页面如实说明文件会上传、多久删除
      UNMARK_MAX_UPLOAD_MB: "60"
      UNMARK_MAX_CONCURRENT: "2"      # 同时真正在跑的任务数，决定内存峰值
      UNMARK_MAX_LIVE_JOBS: "24"
      UNMARK_RATE_LIMIT: "12"         # 每个来源每小时最多发起几次
      UNMARK_RATE_WINDOW_MIN: "60"
      UNMARK_JOB_TTL_MIN: "120"
      UNMARK_TRUST_PROXY: "1"         # 在 Cloudflare 后面，按 CF-Connecting-IP 认来源
    # 不对外映射端口：只有隧道容器需要连它，宿主机和局域网都碰不到。
    expose:
      - "8823"
    deploy:
      resources:
        limits:
          memory: 2g                  # 整页位图运算吃内存；给够，免得被 OOM 杀掉
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8823/healthz',timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # --protocol http2：默认的 QUIC 在这条链路上不稳。实测同一个 18.8 MB 文件，
    # 每四五次下载就有一次从 2 秒掉到 90 秒以上（8 MB/s → 126 KB/s），其余次数正常；
    # 而容器内直连原点稳定在 245 MB/s，所以问题不在应用也不在磁盘。
    # cloudflared 默认建 4 条连接轮流用，只要其中一条路径差，就正好是这个命中率。
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?请在 .env 里设置 TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_healthy
